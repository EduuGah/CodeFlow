name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo branch cancela a execução anterior, que já ficou obsoleta.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, testes e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci respeita o package-lock e falha se ele estiver dessincronizado,
      # ao contrário de npm install.
      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # A suíte que mais importa aqui: um exercício com teste errado não quebra
      # a aplicação, ele ensina errado — e nada mais nesta lista pegaria isso.
      #
      # As falhas viram anotações do GitHub porque o log de execução exige
      # autenticação para ser lido, e a anotação não. Sem isso, descobrir por que
      # o CI quebrou depende de ter acesso à conta — foi assim que sete commits
      # seguidos ficaram vermelhos sem ninguém enxergar o motivo.
      - name: Rodar testes
        # FORCE_COLOR=0 porque a saída vira anotação: código de cor no meio do
        # texto deixa a mensagem ilegível justamente quando ela é mais necessária.
        env:
          FORCE_COLOR: '0'
        run: |
          set +e
          npm test 2>&1 | tee /tmp/testes.txt
          codigo=${PIPESTATUS[0]}

          if [ "$codigo" -ne 0 ]; then
            grep -E "FAIL|AssertionError|Error:|expected" /tmp/testes.txt | head -30 | while IFS= read -r linha; do
              echo "::error::$linha"
            done
          fi

          exit "$codigo"

      # O CI roda em UTC e a máquina de quem escreve, não. Um exercício de datas
      # que dependa do fuso passa de um lado e falha do outro — e o pior caso é
      # passar nos dois por acaso, ensinando errado. Kiritimati é UTC+14, o
      # extremo oposto do CI.
      - name: Conteúdo em outro fuso horário
        run: npm test -- src/content/content.test.ts
        env:
          TZ: Pacific/Kiritimati

      - name: Build de produção
        run: npm run build

  banco:
    name: Migrações num Postgres de verdade
    runs-on: ubuntu-latest
    # O teste de migrações do Vitest lê o SQL como texto; aqui ele roda. Uma
    # função com erro de sintaxe, uma policy que não recusa o que devia, um
    # gatilho que não dispara — tudo isso só aparecia quando alguém colava o
    # arquivo no SQL Editor do Supabase.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Aplicar as migrações duas vezes e verificar o comportamento
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash supabase/verificacao/rodar.sh

  e2e:
    name: Navegador de verdade
    runs-on: ubuntu-latest
    # Depois da verificação: se os tipos ou os testes de unidade já quebraram,
    # baixar um navegador para descobrir de novo é desperdício.
    needs: verificar

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Só o Chromium. Os outros navegadores dobrariam o tempo do job para cobrir
      # motores que este produto ainda não prometeu suportar.
      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium

      # Cobre o que o jsdom não alcança: layout, CSS, foco de verdade, o Web
      # Worker do sandbox e o editor de código carregando.
      - name: Rodar E2E
        run: npm run test:e2e

      - name: Guardar o relatório quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
